spring.application.name=bankcore
spring.datasource.url=${BANKCORE_DB_URL:jdbc:postgresql://127.0.0.1:5432/bankcore}
spring.datasource.username=${BANKCORE_DB_USER:bankcore}
spring.datasource.password=${BANKCORE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
bankcore.jwt.secret=${BANKCORE_JWT_SECRET}
spring.rabbitmq.host=${BANKCORE_RABBIT_HOST:127.0.0.1}
spring.rabbitmq.port=${BANKCORE_RABBIT_PORT:5672}
spring.rabbitmq.username=${BANKCORE_RABBIT_USER:bankcore}
spring.rabbitmq.password=${BANKCORE_RABBIT_PASSWORD:bankcore-local-only}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false
